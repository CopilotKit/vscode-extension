<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#0a0a12"/>
  <!-- Top accent line: violet gradient -->
  <defs>
    <linearGradient id="violet-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#aa66ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#aa66ff"/>
      <stop offset="80%" stop-color="#8844dd"/>
      <stop offset="100%" stop-color="#8844dd" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1200" height="4" fill="url(#violet-gradient)"/>
  <!-- Bracket icon (centered) -->
  <text x="600" y="200" text-anchor="middle" font-family="monospace" font-size="96" font-weight="700" fill="#aa66ff">&lt;/&gt;</text>
  <!-- Product name -->
  <text x="600" y="300" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="700" fill="#ffffff">CopilotKit for VS Code</text>
  <!-- Tagline -->
  <text x="600" y="370" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#e8e8f0">
    Preview, debug, and inspect agents without leaving your editor
  </text>
  <!-- Features -->
  <text x="600" y="440" text-anchor="middle" font-family="monospace" font-size="20" fill="#888899">
    A2UI Preview  |  Hook Explorer  |  AG-UI Inspector
  </text>
  <!-- Bottom left -->
  <text x="60" y="590" text-anchor="start" font-family="monospace" font-size="18" fill="#aa66ff">
    v0.1.0 - Free - MIT
  </text>
  <!-- Bottom right: URL -->
  <text x="1140" y="590" text-anchor="end" font-family="monospace" font-size="18" fill="#aa66ff">
    vscode.copilotkit.dev
  </text>
</svg>
